name: CI

on:
  push:
    branches: ['*']
  pull_request:
  workflow_dispatch:

# Template self-test: build against the bundled sample (samples/site.toml resolves when neither
# DAYSITE_CONFIG nor a conventional ../site.toml exists), which exercises the ios/android
# appindex-compatibility path end to end.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx astro build
      - name: The sample rendered
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -q "Net Skip" dist/index.html
