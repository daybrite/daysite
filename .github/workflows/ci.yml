name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write # the exercise job deploys its result to this repo's Pages
  id-token: write

jobs:
  # Template self-test: build against the bundled NetSkip sample (samples/site.toml resolves
  # when neither DAYSITE_CONFIG nor a conventional ../site.toml exists), which keeps the
  # ios/android appindex-compatibility path honest. Cheap, so it runs on PRs too.
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx astro build
      - name: The sample rendered
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -q "Net Skip" dist/index.html

  # The real thing: scaffold a brand-new Day project with the day CLI (whose `day new app`
  # ships a website/), build its web-dom target, and run THIS checkout of the template over the
  # scaffold's own data — store/ listings, Day.toml, the built web app. Template changes are
  # thereby exercised against exactly what a fresh `day new app` produces, not against a
  # fixture that can drift from the CLI.
  exercise:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: daysite-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          # main, not latest: `day new app` gained the website/ scaffold after the latest
          # crates.io release. Move to `latest` once a release carries it.
          version: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Scaffold a fresh Day project
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # All eight platform-toolkit pairs the template knows (src/lib/day-targets.ts), so the
          # platform picker, the download cards and the per-platform pages render from real
          # appindex data instead of a two-entry subset. Only web-dom is built below: the runner
          # has no Xcode, NDK, Qt or WinAppSDK, and that is the ordinary case anyway — platform
          # entries come from Day.toml while artifacts come from a release the site links.
          # ios-uikit and android-mdc are also what give the scaffold a store/ (the template
          # drops it for a store-less target set), so the store-listing path is exercised too.
          #
          # --locales is what gives the picker something to show: the site's locale list comes
          # from the scaffold's store/<tag>/ listings, so a single-locale scaffold would never
          # exercise the LOCALE_NAMES metadata or the per-language UI-string tables. `en` is
          # the scaffold's own default and is deliberately absent from the list — passing
          # en-US would stand up a second en-US/ tree beside en/.
          "$DAY_BIN" new app day-sample --no-input \
            --toolkit macos-appkit,ios-uikit,android-mdc,linux-gtk \
            --toolkit linux-qt,windows-xaml,harmony-arkui,web-dom \
            --locales zh-Hans-CN,es-ES,pt-BR,fr-FR,de-DE,ja-JP,ko-KR,it-IT,ru-RU,ar-SA \
            --locales id-ID,tr-TR,vi-VN,th-TH,pl-PL,nl-NL,zh-Hant-TW,uk-UA,cs-CZ,ms-MY
          test -f day-sample/website/site.toml
          # `day new app` generates the app's icon as a seeded SVG master (deterministic on
          # the app id; docs/icons.md#generate in the day repo). The site prefers that master
          # raw — landing app mark and favicon — so its presence is load-checked here, and its
          # use is asserted after the build below. Needs a day CLI new enough to generate it.
          test -f day-sample/resource/icons/icon.svg
          # The scaffold cannot know where it will be hosted; this deploy hosts it on the
          # daysite repo's own Pages.
          sed -i 's|^host = .*|host = "https://daybrite.github.io/daysite"|' day-sample/website/site.toml
      - name: Build the scaffold's web app
        working-directory: ${{ runner.temp }}/day-sample
        run: |
          set -euo pipefail
          "$DAY_BIN" build -p web-dom --profile release
          DIST="$(dirname "$(find build/day -path '*web-dom*' -name index.html | head -1)")"
          test -n "$DIST"
          echo "WEB_DIST=$DIST" >> "$GITHUB_ENV"
      - name: Build the website from the scaffold
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          SITE_DIR="$RUNNER_TEMP/day-sample/website"
          node scripts/generate-appindex.mjs "$RUNNER_TEMP/day-sample" "$SITE_DIR"
          # A fresh scaffold has no dayscript captures on this runner; the gallery page is
          # simply absent, which is itself part of what this exercises.
          node scripts/assemble-gallery.mjs "$RUNNER_TEMP/day-sample/build/day/screenshots" "$SITE_DIR"
          mkdir -p public/webapp
          cp -R "$RUNNER_TEMP/day-sample/$WEB_DIST/." public/webapp/
          test -f public/webapp/index.html
          DAYSITE_CONFIG="$SITE_DIR/site.toml" npx astro build
          test -f dist/index.html
          test -f dist/webapp/index.html
      - name: The site renders every scaffolded platform
        run: |
          set -euo pipefail
          # appindex.json is what every page reads. A target generate-appindex.mjs doesn't map
          # (TARGET_KEYS) drops out of it silently, and the pages would simply render one card
          # fewer, so count the entries before looking at the HTML.
          node -e '
            const p = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).apps[0].platforms;
            const keys = Object.keys(p);
            if (keys.length !== 8) throw new Error(`appindex has ${keys.length} platform(s): ${keys}`);
          ' "$RUNNER_TEMP/day-sample/website/appindex.json"
          # …and the picker's label for each, as the page renders it. The short names come from
          # src/lib/day-targets.ts; a target missing there degrades to its bare appindex key, so
          # matching on the name is what catches a half-added target.
          for name in macOS iOS Android HarmonyOS GNOME KDE Windows Web; do
            grep -qF ">$name<" dist/index.html || {
              echo "platform picker is missing $name" >&2
              exit 1
            }
          done
      - name: The landing page uses the raw vector icon
        run: |
          set -euo pipefail
          # The scaffold's generated SVG master is served as-is and preferred everywhere a
          # browser renders the mark: the favicon <link> and the hero app mark. The PNG set
          # must still be there — apple-touch/PWA slots take no SVG, and it is the fallback
          # for projects with no master.
          test -f dist/app/icon.svg
          grep -q 'rel="icon" type="image/svg+xml"' dist/en/index.html
          grep -q 'app/icon.svg' dist/en/index.html
          test -f dist/_generated/favicons/apple-touch-icon.png
      - name: The picker offers every scaffolded locale
        run: |
          set -euo pipefail
          # The picker labels each locale with its endonym, and a tag LOCALE_NAMES doesn't
          # cover degrades to the bare code ("ms-MY" in the menu). Grepping endonyms is what
          # catches that; grepping the tags would pass either way. One name per script the
          # locale list brings in.
          while IFS= read -r name; do
            grep -qF "$name" dist/index.html || {
              echo "language picker is missing $name" >&2
              exit 1
            }
          done <<'ENDONYMS'
          Čeština
          Bahasa Melayu
          Tiếng Việt
          Türkçe
          Українська
          ไทย
          简体中文
          繁體中文
          ENDONYMS
      - name: The footer carries the Day attribution
        run: |
          set -euo pipefail
          grep -q 'href="https://daybrite.dev"' dist/index.html
          grep -qF 'Built with Day' dist/index.html
          # …localized, like the rest of the template's own strings.
          grep -qF '使用 Day 构建' dist/zh-Hans-CN/index.html
          grep -qF 'Créé avec Day' dist/fr-FR/index.html
          # A scaffold sets no `footer` in site.toml, and the template no longer invents a
          # copyright line to fill the slot. An author who writes one gets it rendered here.
          ! grep -qF '©' dist/index.html
      - name: Upload the Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        if: ${{ github.event_name != 'pull_request' }}
        id: deploy
        uses: actions/deploy-pages@v5
