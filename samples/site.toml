# Configuration for a Day project website (website/site.toml).
# This sample describes Day Showcase as it is on its main branch: `npm run sample` clones the app,
# exports its listing with the day CLI, fetches a few of its published screenshots, and generates
# the site's data from them the way CI does for a real repository.
# In an app repository, only `host` is required — everything else has a sensible default.

host = "https://showcase.daybrite.dev"
accent-color = "#ff9500"
default-theme = "system"
default-platform = "ios"
footer = "© {year} Daybrite"
