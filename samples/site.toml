# Configuration for a Day project website (website/site.toml).
# This sample drives the bundled Day Showcase fixture (the app's own Day.toml, store/ texts,
# icon master, and a few screenshots under samples/) so a bare template checkout can build:
# `npm run sample` generates its data the way CI does for a real repository.
# In an app repository, only `host` is required — everything else has a sensible default.

host = "https://showcase.daybrite.dev"
accent-color = "#ff9500"
default-theme = "system"
default-platform = "ios"
footer = "© {year} Daybrite"
